spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/job_tracker_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:jobtracker}
    password: ${DB_PASSWORD:jobtracker_secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
