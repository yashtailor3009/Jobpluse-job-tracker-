<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
      margin: 0;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    .btn:hover {
      opacity: 0.95;
    }
    .instructions {
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div>
      <h3 class="title">JobPulse Clipper</h3>
      <p class="subtitle">1-Click Cross-Platform Save</p>
    </div>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <span style="font-size: 11px; color: #94a3b8;">JobPulse Status:</span>
      <span class="status-badge">
        <span class="status-dot"></span> Active
      </span>
    </div>
    <p style="font-size: 11px; color: #cbd5e1; margin: 0;">
      Browse LinkedIn, Indeed, or Greenhouse. A floating <strong>"Save to JobPulse"</strong> button will automatically appear!
    </p>
  </div>

  <button class="btn" id="clip-tab-btn" style="margin-bottom: 8px;">
    ⚡ Clip This Page to JobPulse
  </button>

  <button class="btn" id="open-dashboard-btn" style="background: #1e293b; color: #94a3b8; box-shadow: none; border: 1px solid #334155;">
    Open JobPulse Dashboard ↗
  </button>

  <div id="clip-status" style="display: none; font-size: 11px; margin-top: 8px; text-align: center; font-weight: 600;"></div>

  <p class="instructions">
    Connected to local server on port 8080 / 5173
  </p>

  <script src="popup.js"></script>
</body>
</html>
